<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Bolinao Falls illustration</title>
  <desc id="desc">Stylized waterfall, cliffs, and pool representing Bolinao Falls.</desc>
  <defs>
    <linearGradient id="pool" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#92eef2"/>
      <stop offset="100%" stop-color="#2aa6ae"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#d9f2e4"/>
  <rect x="0" y="130" width="280" height="620" fill="#4d7d57"/>
  <rect x="920" y="110" width="280" height="640" fill="#4d7d57"/>
  <rect x="280" y="120" width="640" height="250" fill="#6fa57a"/>
  <rect x="480" y="160" width="240" height="310" rx="70" fill="#f7fcff"/>
  <rect x="460" y="430" width="280" height="80" rx="32" fill="#bceef7" opacity=".8"/>
  <ellipse cx="600" cy="610" rx="330" ry="110" fill="url(#pool)"/>
  <text x="72" y="104" fill="#1d2925" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">Bolinao Falls</text>
  <text x="72" y="162" fill="#176b55" font-family="Arial, Helvetica, sans-serif" font-size="34">Bolinao, Pangasinan</text>
</svg>
