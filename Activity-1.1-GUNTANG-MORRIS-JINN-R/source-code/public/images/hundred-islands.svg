<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Hundred Islands National Park illustration</title>
  <desc id="desc">Stylized sea, islands, and sky representing Hundred Islands National Park.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#9bd4ff"/>
      <stop offset="100%" stop-color="#dff5ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4ab6c8"/>
      <stop offset="100%" stop-color="#176b55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#sky)"/>
  <rect y="360" width="1200" height="390" fill="url(#sea)"/>
  <circle cx="980" cy="140" r="62" fill="#ffe7a6"/>
  <ellipse cx="230" cy="420" rx="170" ry="78" fill="#285f46"/>
  <ellipse cx="480" cy="390" rx="110" ry="56" fill="#2f7552"/>
  <ellipse cx="800" cy="445" rx="200" ry="82" fill="#245844"/>
  <ellipse cx="1030" cy="395" rx="120" ry="54" fill="#2a6a4c"/>
  <path d="M0 560c90-20 160-20 250 8s150 40 240 22 160-66 270-54 176 66 440 18v196H0Z" fill="#0f4f3f" opacity=".28"/>
  <text x="72" y="104" fill="#1d2925" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="700">Hundred Islands</text>
  <text x="72" y="162" fill="#176b55" font-family="Arial, Helvetica, sans-serif" font-size="34">Alaminos City, Pangasinan</text>
</svg>
